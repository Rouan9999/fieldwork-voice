name: tests

on:
  push:
  workflow_dispatch:
    inputs:
      live:
        description: "Also run live checks with secrets (keys, 20 scripted calls, Fish voice test). Costs cents."
        type: boolean
        default: false
      share_bookings:
        description: "Share the agent's bookings calendar with OWNER_EMAIL (repo variable)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --with pytest pytest -q

  live:
    if: github.event_name == 'workflow_dispatch' && (inputs.live || inputs.share_bookings)
    needs: unit
    runs-on: ubuntu-latest
    env:
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      CALENDAR_ID: ${{ vars.CALENDAR_ID }}
      OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Share bookings calendar with the owner
        if: inputs.share_bookings
        run: uv run python scripts/share_bookings_calendar.py
        continue-on-error: true
      - name: Check keys (prints OK/FAIL only, never the keys)
        run: uv run --with requests python scripts/check_keys.py
        continue-on-error: true
      - name: 20 scripted calls vs Claude Haiku 5.5
        if: inputs.live
        run: uv run python scripts/eval_calls.py
        continue-on-error: true
      - name: Fish voice latency (s2.1-pro only on free tier)
        if: inputs.live
        env:
          FISH_MODELS: s2.1-pro
        run: uv run python scripts/tts_latency.py 2
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-results
          path: |
            eval_results.json
            samples/
          if-no-files-found: ignore
